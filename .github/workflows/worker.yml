name: Worker de demandas

on:
  schedule:
    # A cada 10 min, seg a sex, 08h as 19h (Brasilia = UTC-3)
    - cron: "*/10 11-21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: worker-demandas
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMPRESA_CLIENTE_ID: ${{ secrets.EMPRESA_CLIENTE_ID }}
